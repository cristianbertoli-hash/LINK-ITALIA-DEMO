name: Temporary Safe Artifact Cleanup

on:
  push:
    paths:
      - ".github/workflows/cleanup-artifacts-hosted-temp.yml"

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Analyze and delete only safe duplicate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          KEEP_LATEST_PER_NAME=2
          MIN_AGE_DAYS=3
          PROTECTED=[re.compile(x,re.I) for x in [
              "gold","canonical","release","stable","approved","baseline",
              "master","final","prod","signed"
          ]]
          token=os.environ["GH_TOKEN"]; repo=os.environ["GITHUB_REPOSITORY"]
          base=f"https://api.github.com/repos/{repo}/actions/artifacts"
          def curl(method,url):
              cp=subprocess.run([
                  "curl","--fail","--silent","--show-error","--location",
                  "-X",method,"-H","Accept: application/vnd.github+json",
                  "-H",f"Authorization: Bearer {token}",
                  "-H","X-GitHub-Api-Version: 2022-11-28",
                  "-H","User-Agent: temp-safe-artifact-cleanup",url
              ],check=True,capture_output=True,text=True)
              return cp.stdout
          artifacts=[]; page=1
          while True:
              data=json.loads(curl("GET",f"{base}?per_page=100&page={page}"))
              batch=data.get("artifacts",[]); artifacts.extend(batch)
              if len(batch)<100: break
              page+=1
          active=[a for a in artifacts if not a.get("expired",False)]
          groups={}
          for a in active: groups.setdefault(a["name"],[]).append(a)
          now=datetime.now(timezone.utc); deleted=[]; kept=[]
          for name,items in groups.items():
              items.sort(key=lambda a:a["created_at"],reverse=True)
              protected=any(rx.search(name) for rx in PROTECTED)
              for idx,a in enumerate(items):
                  size=int(a.get("size_in_bytes") or 0)
                  created=datetime.fromisoformat(a["created_at"].replace("Z","+00:00"))
                  age=(now-created).total_seconds()/86400
                  if protected: kept.append(("PROTECTED",name,a["id"],size)); continue
                  if idx<KEEP_LATEST_PER_NAME: kept.append(("LATEST",name,a["id"],size)); continue
                  if age<MIN_AGE_DAYS: kept.append(("YOUNG",name,a["id"],size)); continue
                  curl("DELETE",f"{base}/{a['id']}")
                  deleted.append((name,a["id"],size))
          freed=sum(x[2] for x in deleted)
          print(f"Repository: {repo}")
          print(f"Active artifacts before cleanup: {len(active)}")
          print(f"Deleted safe duplicates: {len(deleted)}")
          print(f"Freed MiB: {freed/1024/1024:.2f}")
          for x in deleted: print(f"DELETED | {x[0]} | id={x[1]} | {x[2]} bytes")
          for x in kept: print(f"KEEP_{x[0]} | {x[1]} | id={x[2]} | {x[3]} bytes")
          PY
